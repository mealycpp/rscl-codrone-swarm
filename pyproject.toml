[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rscl-codrone-swarm"
version = "0.5.1"
description = "RSCL physical-drone LED studio and advanced mission fabric for CoDrone EDU swarms"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pyserial>=3.5,<4",
]

[tool.setuptools.packages.find]
where = ["src"]
